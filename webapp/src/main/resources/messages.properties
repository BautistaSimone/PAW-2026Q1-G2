Email.purchase.buyer.confirmed.msg=We have reserved the vinyl for you. Transfer the indicated amount to the seller's CBU/CVU (or coordinate by email if not listed). Save the receipt. When you pay, enter the order details with the button below and tap "Notify that I have already paid".
